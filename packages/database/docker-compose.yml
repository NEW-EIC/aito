# Local Postgres for AITO / Alto Phase 1 development.
# Zero-cost — runs entirely on your laptop, no SaaS account required.
#
# Usage:
#   docker-compose up -d        # start postgres in the background
#   docker-compose logs -f      # tail logs
#   docker-compose down         # stop
#   docker-compose down -v      # stop AND wipe data (fresh start)

services:
  postgres:
    image: postgres:16-alpine
    container_name: aito-alto-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: aito
      POSTGRES_PASSWORD: aito_dev_only
      POSTGRES_DB: aito_alto
      # Postgres 13+ has gen_random_uuid() built in; we still install
      # pgcrypto + citext via the schema's `extensions` block.
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    ports:
      - "5432:5432"
    volumes:
      - aito_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aito -d aito_alto"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  aito_pg_data:
